instance_url: https://jira.example.com
auth:
  type: token
  env_var: JIRA_API_TOKEN
queries:
  - jql: "assignee = currentUser() AND status != Done ORDER BY updated DESC"
    domain: my-project
    max_results: 50
  - jql: "project = MYPROJ AND labels = security AND assignee = currentUser()"
    domain: my-project
    max_results: 25
