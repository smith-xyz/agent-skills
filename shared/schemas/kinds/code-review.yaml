kind: code-review
version: 1
description: PR review verdicts
fields:
  pr_number: { type: integer, required: true }
  pr_url: { type: string, required: true }
  verdict: { type: enum, required: true, values: [approve, approve-with-comments, request-changes, reject] }
  risk: { type: enum, values: [low, medium, high, critical] }
  blockers_count: { type: integer }
  concerns: { type: array, items: string }
