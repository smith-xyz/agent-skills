[package]
name = "reflect"
version = "0.1.0"
edition = "2021"
description = "Offline reflection engine: hook pass-off, digest, review-gated skill proposals"
license = "MIT"
publish = false

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
